name: checks
on: [push, pull_request]
jobs:
  scripts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python tests/run_checks.py
        env:
          PYTHONIOENCODING: utf-8
